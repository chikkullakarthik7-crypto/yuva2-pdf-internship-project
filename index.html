<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuva2 PDF Project</title>
  <style>
    :root { --primary:#2563eb; --dark:#0f172a; --soft:#f1f5f9; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Arial,sans-serif; background:var(--soft); color:var(--dark); }
    header { background:linear-gradient(135deg,#1d4ed8,#7c3aed); color:white; padding:28px 20px; text-align:center; }
    header h1 { margin:0 0 8px; }
    main { max-width:1100px; margin:24px auto; padding:0 16px 40px; }
    .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(15,23,42,.08); padding:20px; }
    .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    input[type=file] { flex:1; min-width:240px; }
    button { border:0; border-radius:8px; background:var(--primary); color:white; padding:10px 16px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    iframe { width:100%; height:72vh; border:1px solid #cbd5e1; border-radius:10px; background:white; }
    .note { color:#475569; margin:12px 0 0; }
  </style>
</head>
<body>
  <header>
    <h1>YUVA2 PDF Viewer</h1>
    <p>Internship project — PDF upload and browser preview</p>
  </header>
  <main>
    <section class="card">
      <div class="toolbar">
        <input id="pdfFile" type="file" accept="application/pdf" />
        <button id="openButton" disabled>Open PDF</button>
      </div>
      <iframe id="pdfViewer" title="PDF Preview"></iframe>
      <p class="note">Choose a PDF file to preview it securely in your browser.</p>
    </section>
  </main>
  <script>
    const fileInput = document.getElementById('pdfFile');
    const openButton = document.getElementById('openButton');
    const viewer = document.getElementById('pdfViewer');

    fileInput.addEventListener('change', () => {
      openButton.disabled = !fileInput.files.length;
    });

    openButton.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) return;
      viewer.src = URL.createObjectURL(file);
    });
  </script>
</body>
</html>
